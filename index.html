<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM Tool Rollout Readiness Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface2: #263248;
    --accent: #3b82f6;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --text: #f1f5f9;
    --subtext: #94a3b8;
    --border: #334155;
    --card-hover: #2d3f58;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }

  .dashboard {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 16px;
  }

  /* ── HEADER ── */
  .header {
    margin-bottom: 20px;
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 14px;
  }

  .header h1 {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .header-meta {
    font-size: 12px;
    color: var(--subtext);
    margin-top: 3px;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .exec-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    border: 1px solid transparent;
  }

  .pill-label { opacity: 0.75; font-weight: 500; }

  .pill.green { background: rgba(34,197,94,0.15); border-color: rgba(34,197,94,0.35); color: #4ade80; }
  .pill.yellow { background: rgba(245,158,11,0.15); border-color: rgba(245,158,11,0.35); color: #fbbf24; }
  .pill.red { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.35); color: #f87171; }
  .pill.blue { background: rgba(59,130,246,0.15); border-color: rgba(59,130,246,0.35); color: #60a5fa; }

  /* ── CONTROLS ── */
  .controls-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--surface);
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 18px;
  }

  .control-group {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .control-label {
    font-size: 11px;
    color: var(--subtext);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .control-divider {
    width: 1px;
    height: 28px;
    background: var(--border);
  }

  select.ctrl-select {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 5px 10px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    outline: none;
    transition: border-color 0.2s;
  }

  select.ctrl-select:hover, select.ctrl-select:focus {
    border-color: var(--accent);
  }

  .seg-control {
    display: flex;
    background: var(--surface2);
    border-radius: 6px;
    border: 1px solid var(--border);
    overflow: hidden;
  }

  .seg-btn {
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    color: var(--subtext);
    border: none;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .seg-btn.active {
    background: var(--accent);
    color: #fff;
  }

  .seg-btn:hover:not(.active) {
    background: var(--border);
    color: var(--text);
  }

  .toggle-btn {
    padding: 5px 12px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface2);
    color: var(--subtext);
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .toggle-btn.active {
    background: rgba(59,130,246,0.2);
    color: var(--accent);
    border-color: var(--accent);
  }

  .toggle-btn:hover:not(.active) {
    border-color: var(--accent);
    color: var(--text);
  }

  /* Phase chips */
  .phase-chips {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .phase-chip {
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    background: var(--surface2);
    color: var(--subtext);
    border: 1px solid var(--border);
    border-radius: 999px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .phase-chip.active {
    background: rgba(59,130,246,0.2);
    color: var(--accent);
    border-color: var(--accent);
  }

  .phase-chip:hover:not(.active) {
    border-color: var(--accent);
    color: var(--text);
  }

  /* ── RISK BANNER ── */
  .risk-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.4);
    border-radius: 8px;
    margin-bottom: 16px;
    color: #fca5a5;
    font-size: 13px;
    font-weight: 500;
  }

  .risk-banner .risk-icon { font-size: 16px; }

  /* ── COMPARE BAR ── */
  .compare-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: rgba(59,130,246,0.08);
    border: 1px solid rgba(59,130,246,0.3);
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 12px;
    flex-wrap: wrap;
  }

  .compare-bar .compare-label { color: var(--accent); font-weight: 600; }

  /* ── KPI CARDS ── */
  .kpi-row {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }

  @media (max-width: 1100px) { .kpi-row { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px) { .kpi-row { grid-template-columns: repeat(2, 1fr); } }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    position: relative;
    transition: all 0.2s;
    overflow: hidden;
  }

  .kpi-card.clickable {
    cursor: pointer;
  }

  .kpi-card.clickable:hover {
    background: var(--card-hover);
    border-color: var(--accent);
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  }

  .kpi-card.risk-highlight {
    border-color: rgba(239,68,68,0.5);
    box-shadow: 0 0 0 1px rgba(239,68,68,0.2);
  }

  .kpi-card.caution-highlight {
    border-color: rgba(245,158,11,0.5);
    box-shadow: 0 0 0 1px rgba(245,158,11,0.2);
  }

  .kpi-label {
    font-size: 11px;
    color: var(--subtext);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .kpi-value {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }

  .kpi-sublabel {
    font-size: 11px;
    color: var(--subtext);
    margin-bottom: 8px;
  }

  .kpi-bar-track {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }

  .kpi-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.5s ease;
  }

  .kpi-delta {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 11px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .kpi-delta.better { background: rgba(34,197,94,0.2); color: #4ade80; }
  .kpi-delta.worse { background: rgba(239,68,68,0.2); color: #f87171; }
  .kpi-delta.neutral { background: rgba(148,163,184,0.15); color: var(--subtext); }

  .kpi-click-hint {
    position: absolute;
    bottom: 8px;
    right: 10px;
    font-size: 10px;
    color: var(--subtext);
    opacity: 0;
    transition: opacity 0.2s;
  }

  .kpi-card.clickable:hover .kpi-click-hint { opacity: 1; }

  /* Readiness badge */
  .readiness-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .readiness-badge.ready { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }
  .readiness-badge.caution { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
  .readiness-badge.not-ready { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }

  /* ── PANELS ── */
  .panels-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 18px;
  }

  @media (max-width: 900px) { .panels-row { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }

  .panel-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .panel-title::before {
    content: '';
    display: inline-block;
    width: 3px;
    height: 14px;
    border-radius: 2px;
    background: var(--accent);
  }

  /* Chart container */
  .chart-container {
    position: relative;
    height: 200px;
    margin-bottom: 14px;
  }

  .chart-container.small { height: 160px; }
  .chart-container.medium { height: 220px; }
  .chart-container.large { height: 280px; }

  /* Stats list */
  .stats-list { display: flex; flex-direction: column; gap: 8px; }

  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .stat-label { font-size: 12px; color: var(--subtext); }

  .stat-value {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  .stat-bar-container {
    flex: 1;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    overflow: hidden;
    min-width: 60px;
  }

  .stat-bar {
    height: 100%;
    border-radius: 3px;
    transition: width 0.5s;
  }

  /* Reopen breakdown */
  .reopen-breakdown {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .reopen-breakdown-title {
    font-size: 11px;
    color: var(--subtext);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .breakdown-bars {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .breakdown-bar-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .breakdown-bar-label {
    font-size: 11px;
    color: var(--subtext);
    width: 24px;
    flex-shrink: 0;
  }

  .breakdown-bar-track {
    flex: 1;
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }

  .breakdown-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s;
  }

  .breakdown-bar-val {
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    width: 20px;
    text-align: right;
    flex-shrink: 0;
  }

  /* Risk badge */
  .risk-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 14px;
  }

  .risk-badge.high { background: rgba(239,68,68,0.2); color: #f87171; border: 1px solid rgba(239,68,68,0.4); }
  .risk-badge.medium { background: rgba(245,158,11,0.2); color: #fbbf24; border: 1px solid rgba(245,158,11,0.4); }
  .risk-badge.low { background: rgba(34,197,94,0.2); color: #4ade80; border: 1px solid rgba(34,197,94,0.4); }

  /* Risk metrics */
  .risk-metrics { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; }

  .risk-metric {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 10px;
    background: var(--surface2);
    border-radius: 6px;
    font-size: 12px;
  }

  .risk-metric-label { color: var(--subtext); }
  .risk-metric-value { font-weight: 700; }

  /* ── TIMELINE PANEL ── */
  .timeline-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
  }

  .timeline-toggle-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }

  .timeline-toggle-header:hover .timeline-expand-icon { color: var(--accent); }

  .timeline-expand-icon {
    color: var(--subtext);
    font-size: 14px;
    transition: all 0.3s;
  }

  .timeline-expand-icon.open { transform: rotate(180deg); }

  .timeline-content {
    overflow: hidden;
    transition: max-height 0.4s ease;
  }

  .timeline-content.collapsed { max-height: 0; }
  .timeline-content.expanded { max-height: 500px; }

  /* Snapshot mini cards */
  .snapshot-mini-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }

  @media (max-width: 700px) { .snapshot-mini-cards { grid-template-columns: 1fr; } }

  .snapshot-mini-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .snapshot-mini-card:hover, .snapshot-mini-card.selected {
    border-color: var(--accent);
    background: var(--card-hover);
  }

  .mini-card-date { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
  .mini-card-env { font-size: 10px; color: var(--subtext); margin-bottom: 8px; }
  .mini-card-metrics { display: flex; flex-direction: column; gap: 3px; }
  .mini-card-metric { font-size: 11px; display: flex; justify-content: space-between; }
  .mini-card-metric-label { color: var(--subtext); }
  .mini-card-metric-value { font-weight: 600; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(4px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    width: 100%;
    max-width: 580px;
    max-height: 85vh;
    overflow-y: auto;
    transform: scale(0.95);
    transition: transform 0.3s;
    position: relative;
  }

  .modal-overlay.open .modal { transform: scale(1); }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }

  .modal-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }

  .modal-close {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--subtext);
    font-size: 16px;
    line-height: 1;
    transition: all 0.2s;
  }

  .modal-close:hover { color: var(--text); border-color: var(--accent); }

  .modal-section { margin-bottom: 18px; }
  .modal-section-title { font-size: 11px; color: var(--subtext); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 10px; }

  .modal-stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 16px;
  }

  .modal-stat-box {
    background: var(--surface2);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: center;
  }

  .modal-stat-box-value { font-size: 22px; font-weight: 700; margin-bottom: 2px; }
  .modal-stat-box-label { font-size: 10px; color: var(--subtext); font-weight: 600; text-transform: uppercase; }

  .modal-trend {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: var(--surface2);
    border-radius: 6px;
    font-size: 12px;
  }

  .modal-trend-label { color: var(--subtext); }
  .modal-trend-value { font-weight: 700; }

  .modal-chart-container { height: 180px; position: relative; }

  .modal-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .modal-table th { text-align: left; padding: 7px 10px; color: var(--subtext); font-weight: 600; border-bottom: 1px solid var(--border); }
  .modal-table td { padding: 7px 10px; border-bottom: 1px solid rgba(51,65,85,0.5); }
  .modal-table tr:last-child td { border-bottom: none; }

  /* Trend arrows */
  .trend-up-good { color: #4ade80; }
  .trend-up-bad { color: #f87171; }
  .trend-down-good { color: #4ade80; }
  .trend-down-bad { color: #f87171; }
  .trend-neutral { color: var(--subtext); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--subtext); }

  /* Env badge */
  .env-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: rgba(59,130,246,0.2);
    color: #60a5fa;
    border: 1px solid rgba(59,130,246,0.3);
  }

  .env-badge.prod { background: rgba(239,68,68,0.15); color: #fca5a5; border-color: rgba(239,68,68,0.3); }
  .env-badge.uat { background: rgba(245,158,11,0.15); color: #fde68a; border-color: rgba(245,158,11,0.3); }

  /* Timeline full mode */
  .timeline-full {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 18px;
  }

  .timeline-full-chart { height: 320px; position: relative; }

  /* Legend dots */
  .legend-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--subtext);
  }

  .legend-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Notes tag */
  .notes-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 8px;
    background: rgba(245,158,11,0.1);
    border: 1px solid rgba(245,158,11,0.3);
    color: #fbbf24;
    border-radius: 4px;
    font-size: 11px;
    margin-top: 8px;
  }

  /* ── UTILITY ── */
  .hidden { display: none !important; }
  .text-success { color: var(--success); }
  .text-warning { color: var(--warning); }
  .text-danger { color: var(--danger); }
  .text-accent { color: var(--accent); }
  .text-sub { color: var(--subtext); }

  .mt-2 { margin-top: 8px; }
  .mt-3 { margin-top: 12px; }
  .flex { display: flex; }
  .items-center { align-items: center; }
  .gap-2 { gap: 8px; }
  .flex-wrap { flex-wrap: wrap; }

  /* ── RELOAD BUTTON ── */
  .reload-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
    white-space: nowrap;
  }

<body>

<div class="dashboard" id="app"></div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
let SNAPSHOTS = [
  {
    id: "23feb2026", reportDate: "23 Feb 2026", environment: "UAT", phase: "After Soft Launch 01",
    total: 224, beforeMRO: 208, afterMRO: 16,
    closed: 26, cancelled: 8, passed: 156,
    passedReopenBreakdown: [12, 8, 0],
    open: 7, reopen: 11,
    reopenBreakdown: [4, 4, 2, 0],
    severityHigh: 9, severityMedium: 7, severityLow: 2,
    toConfirm: 0, notes: ""
  },
  {
    id: "25feb2026", reportDate: "25 Feb 2026", environment: "PROD", phase: "After Soft Launch 02",
    total: 141, beforeMRO: 134, afterMRO: 7,
    closed: 3, cancelled: 4, passed: 37,
    passedReopenBreakdown: [3, 5, 0],
    open: 74, reopen: 15,
    reopenBreakdown: [1, 3, 2, 0],
    severityHigh: 38, severityMedium: 45, severityLow: 6,
    toConfirm: 0, notes: ""
  },
  {
    id: "18mar2026", reportDate: "18 Mar 2026", environment: "PRD", phase: "After Soft Launch 02",
    total: 194, beforeMRO: 163, afterMRO: 31,
    closed: 20, cancelled: 6, passed: 110,
    passedReopenBreakdown: [26, 3, 0],
    open: 11, reopen: 10,
    reopenBreakdown: [5, 2, 2, 1],
    severityHigh: 9, severityMedium: 10, severityLow: 0,
    toConfirm: 6, notes: "To confirm: 6 issues"
  },
  {
    id: "raw27march2026", reportDate: "27 Mar 2026", environment: "PROD", phase: "After Mass Roll-out",
    total: 226, beforeMRO: 180, afterMRO: 46,
    closed: 11, cancelled: 15, passed: 142,
    passedReopenBreakdown: [23, 4, 3],
    open: 51, reopen: 7,
    reopenBreakdown: [3, 5, 2],
    severityHigh: 23, severityMedium: 34, severityLow: 1,
    toConfirm: 0, notes: ""
  },
  {
    id: "raw30march2026", reportDate: "30 Mar 2026", environment: "PROD", phase: "After Mass Roll-out",
    total: 226, beforeMRO: 180, afterMRO: 46,
    closed: 11, cancelled: 15, passed: 145,
    passedReopenBreakdown: [25, 5, 4],
    open: 48, reopen: 6,
    reopenBreakdown: [1, 4, 1],
    severityHigh: 19, severityMedium: 34, severityLow: 1,
    toConfirm: 0, notes: ""
  }
];

let PHASES = ["After Soft Launch 01", "After Soft Launch 02"];

// ─────────────────────────────────────────────
// MARKDOWN PARSER
// ─────────────────────────────────────────────
function parseMarkdownSnapshot(text, filename) {
  const lines = text.split('\n');

  // Split into named sections by ### headings
  const sectionMap = {};
  let curName = '__top__';
  sectionMap[curName] = [];
  for (const raw of lines) {
    if (/^#{2,3}\s/.test(raw)) {
      curName = raw.replace(/^#+\s*/, '').trim().toLowerCase();
      sectionMap[curName] = [];
    } else {
      sectionMap[curName].push(raw);
    }
  }

  function numFrom(str) {
    if (!str) return 0;
    const m = String(str).match(/\d+/);
    return m ? parseInt(m[0]) : 0;
  }

  function getValue(sLines, key) {
    const re = new RegExp(`^\\s*-\\s+${key}[^:]*:\\s*(.+)$`, 'i');
    for (const l of sLines) {
      const m = l.match(re);
      if (m) return m[1].trim();
    }
    return '';
  }

  function getNum(sLines, key) { return numFrom(getValue(sLines, key)); }

  // Parse sub-breakdown: items indented under a parent key line
  // e.g. "- Reopen 1: 23" under "- Passed: 130"
  function getSubBreakdown(sLines, parentKeyRe, subKeyRe) {
    const result = [];
    let inParent = false;
    for (const l of sLines) {
      if (!inParent) {
        if (parentKeyRe.test(l)) inParent = true;
      } else {
        const sub = l.match(subKeyRe);
        if (sub) {
          const idx = parseInt(sub[1]) - 1;
          while (result.length <= idx) result.push(0);
          result[idx] = parseInt(sub[2]);
        } else if (/^\s{0,1}-\s+\S/.test(l)) {
          break; // next top-level item ends parent block
        }
      }
    }
    return result.length > 0 ? result : [0, 0, 0];
  }

  // Locate sections flexibly
  function sec(keyword) {
    const key = Object.keys(sectionMap).find(k => k.includes(keyword));
    return key ? sectionMap[key] : [];
  }

  const headerLines = sectionMap['issue report input'] || sectionMap['__top__'] || [];

  // Report date — normalize to "DD Mon YYYY"
  let reportDate = getValue(headerLines, 'report date').trim();
  if (!reportDate) {
    const fm = filename.match(/(\d{1,2})(\w+)(\d{4})/i);
    if (fm) reportDate = `${fm[1]}${fm[2]}${fm[3]}`;
  }
  const months = { jan:'Jan', feb:'Feb', mar:'Mar', apr:'Apr', may:'May', jun:'Jun',
    jul:'Jul', aug:'Aug', sep:'Sep', oct:'Oct', nov:'Nov', dec:'Dec',
    january:'Jan', february:'Feb', march:'Mar', april:'Apr', june:'Jun',
    july:'Jul', august:'Aug', september:'Sep', october:'Oct', november:'Nov', december:'Dec' };
  reportDate = reportDate.replace(/^(\d{1,2})\s*([A-Za-z]+)\s*(\d{4})$/, (_, d, mon, y) => {
    return `${d} ${months[mon.toLowerCase()] || mon.slice(0,3)} ${y}`;
  });

  // Environment — take last token after ":"
  let environment = getValue(headerLines, 'environment');
  environment = environment.split(':').pop().trim() || 'PROD';

  // Phase — if pattern "(options): value", extract after "):"
  let phase = getValue(headerLines, 'phase');
  if (phase.includes('):')) {
    phase = phase.split('):').pop().trim();
  } else if (!phase.includes('Soft') && !phase.includes('Roll') && phase.includes(':')) {
    phase = phase.split(':').pop().trim();
  }

  // Overall
  const overallLines = sec('overall');
  const total    = getNum(overallLines, 'total issues');
  const beforeMRO = getNum(overallLines, 'before mass roll');
  const afterMRO  = getNum(overallLines, 'after mass roll');

  // Resolution
  const resLines = sec('resolution');
  const closed    = getNum(resLines, 'closed');
  const cancelled = getNum(resLines, 'cancelled') || getNum(resLines, 'canceled');
  const passed    = getNum(resLines, 'passed');
  const passedReopenBreakdown = getSubBreakdown(
    resLines,
    /^\s*-\s+passed\s*:/i,
    /^\s{2,}-\s+reopen\s+(\d+)\s*:\s*(\d+)/i
  );

  // Open
  const openLines = sec('open');
  const open   = getNum(openLines, 'open');
  const reopen = getNum(openLines, 'reopen');
  const reopenBreakdown = getSubBreakdown(
    openLines,
    /^\s*-\s+reopen\s*:/i,
    /^\s{2,}-\s+reopen\s+(\d+)\s*:\s*(\d+)/i
  );

  // Severity
  const sevLines = sec('severity');
  const severityHigh   = getNum(sevLines, 'high');
  const severityMedium = getNum(sevLines, 'medium');
  const severityLow    = getNum(sevLines, 'low');

  // Notes + toConfirm
  const notesLines = sec('notes');
  const allText = [...notesLines, ...openLines].join('\n');
  let toConfirm = 0;
  const tcMatch = allText.match(/to confirm[^:]*:\s*(\d+)/i);
  if (tcMatch) toConfirm = parseInt(tcMatch[1]);

  const noteTexts = notesLines
    .filter(l => l.trim().startsWith('-'))
    .map(l => l.replace(/^\s*-\s*/, '').trim())
    .filter(l => l && !/^(key issues|special cases)\s*$/i.test(l))
    .join(' | ');

  const id = filename.replace(/\.md$/i, '').replace(/[^a-z0-9]/gi, '').toLowerCase();

  return { id, reportDate, environment, phase,
    total, beforeMRO, afterMRO,
    closed, cancelled, passed, passedReopenBreakdown,
    open, reopen, reopenBreakdown,
    severityHigh, severityMedium, severityLow,
    toConfirm, notes: noteTexts };
}

// ─────────────────────────────────────────────
// DATA LOADER
// ─────────────────────────────────────────────
const DATA_PATH = 'data/';
let dataSource = 'built-in';

async function loadSnapshotsFromFiles() {
  const cacheBust = `?v=${Date.now()}`;
  const manifestRes = await fetch(`${DATA_PATH}manifest.json${cacheBust}`);
  if (!manifestRes.ok) throw new Error('manifest not found');
  const manifest = await manifestRes.json();

  const results = [];
  for (const filename of manifest.files) {
    const res = await fetch(`${DATA_PATH}${filename}${cacheBust}`);
    if (!res.ok) { console.warn(`Skipping ${filename} (${res.status})`); continue; }
    const text = await res.text();
    results.push(parseMarkdownSnapshot(text, filename));
  }
  return results;
}

async function reloadData() {
  const btn = document.getElementById('reloadBtn');
  if (btn) { btn.disabled = true; btn.classList.add('loading'); btn.querySelector('.reload-label').textContent = 'Loading…'; }

  try {
    const loaded = await loadSnapshotsFromFiles();
    if (loaded.length > 0) {
      SNAPSHOTS.length = 0;
      SNAPSHOTS.push(...loaded);
      PHASES.length = 0;
      PHASES.push(...[...new Set(SNAPSHOTS.map(s => s.phase))]);
      state.selectedSnapshot = SNAPSHOTS.length - 1;
      state.compareSnapshot  = Math.max(0, SNAPSHOTS.length - 2);
      state.phaseFilter = [];
      dataSource = 'files';
    }
  } catch (e) {
    console.warn('Reload failed, keeping current data:', e);
  }

  render();
}

async function init() {
  try {
    const loaded = await loadSnapshotsFromFiles();
    if (loaded.length > 0) {
      SNAPSHOTS.length = 0;
      SNAPSHOTS.push(...loaded);
      PHASES.length = 0;
      PHASES.push(...[...new Set(SNAPSHOTS.map(s => s.phase))]);
      state.selectedSnapshot = SNAPSHOTS.length - 1;
      state.compareSnapshot  = Math.max(0, SNAPSHOTS.length - 2);
      dataSource = 'files';
    }
  } catch (e) {
    console.warn('Auto-load failed, using built-in data:', e);
  }
  render();
}

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
const state = {
  selectedSnapshot: 2,
  compareMode: false,
  compareSnapshot: 1,
  baseline: "before_mro",
  viewMode: "snapshot",
  drilldown: null,
  phaseFilter: [],
  riskOnly: false,
  timelineExpanded: true,
};

// ─────────────────────────────────────────────
// CHART REGISTRY — destroy before recreate
// ─────────────────────────────────────────────
const chartRegistry = {};

function destroyChart(id) {
  if (chartRegistry[id]) {
    chartRegistry[id].destroy();
    delete chartRegistry[id];
  }
}

function registerChart(id, chart) {
  destroyChart(id);
  chartRegistry[id] = chart;
}

// ─────────────────────────────────────────────
// COMPUTED METRICS
// ─────────────────────────────────────────────
function computeMetrics(snap, baseline) {
  const base = baseline === "total_issues" ? snap.total : snap.beforeMRO;
  const resolved = snap.closed + snap.cancelled + snap.passed;
  const pending = snap.open + snap.reopen + snap.toConfirm;
  const resolutionRate = base > 0 ? (resolved / base * 100) : 0;
  const backlogRate = base > 0 ? (pending / base * 100) : 0;
  const reopenDenom = snap.passed + snap.reopen;
  const reopenRate = reopenDenom > 0 ? (snap.reopen / reopenDenom * 100) : 0;
  const sevTotal = snap.severityHigh + snap.severityMedium + snap.severityLow;
  const highSevRate = sevTotal > 0 ? (snap.severityHigh / sevTotal * 100) : 0;

  let readiness;
  if (resolutionRate >= 90 && backlogRate <= 10 && highSevRate <= 25) {
    readiness = "READY";
  } else if (resolutionRate >= 70 && backlogRate <= 30) {
    readiness = "CAUTION";
  } else {
    readiness = "NOT READY";
  }

  // Overall risk
  let risk;
  if (snap.severityHigh >= 30 || backlogRate >= 50) risk = "HIGH";
  else if (snap.severityHigh >= 10 || backlogRate >= 25) risk = "MEDIUM";
  else risk = "LOW";

  return { base, resolved, pending, resolutionRate, backlogRate, reopenRate, highSevRate, readiness, risk, sevTotal };
}

function getFilteredSnapshots() {
  if (state.phaseFilter.length === 0) return SNAPSHOTS;
  return SNAPSHOTS.filter(s => state.phaseFilter.includes(s.phase));
}

function getReadinessClass(r) {
  if (r === "READY") return "ready";
  if (r === "CAUTION") return "caution";
  return "not-ready";
}

function getPillClass(type, value) {
  if (type === "resolution") return value >= 80 ? "green" : value >= 60 ? "yellow" : "red";
  if (type === "backlog") return value <= 20 ? "green" : value <= 40 ? "yellow" : "red";
  if (type === "reopen") return value <= 10 ? "green" : value <= 20 ? "yellow" : "red";
  if (type === "highsev") return value <= 25 ? "green" : value <= 50 ? "yellow" : "red";
  return "blue";
}

function fmtPct(v) { return v.toFixed(1) + "%"; }
function fmtNum(v) { return v.toLocaleString(); }

function getDelta(curr, prev, type) {
  const diff = curr - prev;
  if (Math.abs(diff) < 0.05) return { label: "→", cls: "neutral" };
  const up = diff > 0;
  let better;
  // for resolution: up = better; for backlog/reopen/highsev/counts: up = worse
  if (type === "resolution") better = up;
  else better = !up;
  const arrow = up ? "↑" : "↓";
  const cls = better ? "better" : "worse";
  const absVal = Math.abs(diff);
  const label = arrow + " " + (type === "count" ? Math.abs(Math.round(diff)) : fmtPct(absVal));
  return { label, cls };
}

function getEnvBadgeClass(env) {
  const e = env.toUpperCase();
  if (e === "UAT") return "uat";
  if (e === "PROD" || e === "PRD") return "prod";
  return "";
}

// ─────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────
function render() {
  const app = document.getElementById("app");
  const snap = SNAPSHOTS[state.selectedSnapshot];
  const metrics = computeMetrics(snap, state.baseline);
  const cSnap = state.compareMode ? SNAPSHOTS[state.compareSnapshot] : null;
  const cMetrics = cSnap ? computeMetrics(cSnap, state.baseline) : null;

  app.innerHTML = buildHTML(snap, metrics, cSnap, cMetrics);
  bindEvents();
  renderCharts(snap, metrics, cSnap, cMetrics);
}

// ─────────────────────────────────────────────
// BUILD HTML
// ─────────────────────────────────────────────
function buildHTML(snap, metrics, cSnap, cMetrics) {
  return `
    ${buildHeader(snap, metrics)}
    ${buildControlsBar(snap)}
    ${state.riskOnly && metrics.readiness !== "READY" ? buildRiskBanner(snap, metrics) : ""}
    ${state.compareMode ? buildCompareBar(snap, cSnap) : ""}
    ${state.viewMode === "snapshot" ? buildSnapshotView(snap, metrics, cSnap, cMetrics) : buildTimelineView()}
  `;
}

function buildHeader(snap, metrics) {
  const rc = getReadinessClass(metrics.readiness);
  const idx = state.selectedSnapshot;
  const prevSnap = idx > 0 ? SNAPSHOTS[idx - 1] : null;
  const prevM    = prevSnap ? computeMetrics(prevSnap, state.baseline) : null;

  // Auto-delta helper for pills
  function pillDelta(curr, prev, type) {
    if (!prev) return "";
    const d = getDelta(curr, prev, type);
    return `<span class="pill-delta ${d.cls}">${d.label}</span>`;
  }
  function readinessDelta() {
    if (!prevM) return "";
    const order = { "READY": 2, "CAUTION": 1, "NOT READY": 0 };
    const diff = order[metrics.readiness] - order[prevM.readiness];
    if (diff > 0) return `<span class="pill-delta better">↑</span>`;
    if (diff < 0) return `<span class="pill-delta worse">↓</span>`;
    return `<span class="pill-delta neutral">→</span>`;
  }

  const pills = [
    { label: "Readiness",     value: metrics.readiness,              cls: rc === "ready" ? "green" : rc === "caution" ? "yellow" : "red", delta: readinessDelta() },
    { label: "Resolution",    value: fmtPct(metrics.resolutionRate),  cls: getPillClass("resolution", metrics.resolutionRate), delta: prevM ? pillDelta(metrics.resolutionRate, prevM.resolutionRate, "resolution") : "" },
    { label: "Backlog",       value: fmtPct(metrics.backlogRate),     cls: getPillClass("backlog",     metrics.backlogRate),     delta: prevM ? pillDelta(metrics.backlogRate,    prevM.backlogRate,    "backlog")     : "" },
    { label: "Reopen Rate",   value: fmtPct(metrics.reopenRate),      cls: getPillClass("reopen",      metrics.reopenRate),      delta: prevM ? pillDelta(metrics.reopenRate,     prevM.reopenRate,     "reopen")      : "" },
    { label: "High Severity", value: fmtPct(metrics.highSevRate),     cls: getPillClass("highsev",     metrics.highSevRate),     delta: prevM ? pillDelta(metrics.highSevRate,    prevM.highSevRate,    "highsev")     : "" },
  ];

  // "vs Previous" summary pill
  const vsPrevPill = prevM ? (() => {
    const resDiff  = metrics.resolutionRate - prevM.resolutionRate;
    const blDiff   = metrics.backlogRate    - prevM.backlogRate;
    const resArrow = resDiff > 0.5 ? "↑" : resDiff < -0.5 ? "↓" : "→";
    const blArrow  = blDiff  < -0.5 ? "↓" : blDiff  > 0.5  ? "↑" : "→";
    const resGood  = resDiff > 0.5;
    const blGood   = blDiff  < -0.5;
    const overallGood = resGood && blGood;
    const overallBad  = resDiff < -0.5 && blDiff > 0.5;
    const cls = overallGood ? "green" : overallBad ? "red" : "yellow";
    return `<div class="pill ${cls}" style="gap:5px">
      <span class="pill-label">vs ${prevSnap.reportDate}</span>
      <span>Res ${resArrow}${Math.abs(resDiff).toFixed(1)}pp</span>
      <span style="opacity:0.6">·</span>
      <span>BL ${blArrow}${Math.abs(blDiff).toFixed(1)}pp</span>
    </div>`;
  })() : "";

  return `
  <div class="header">
    <div class="header-top">
      <div>
        <h1>PM Tool Rollout Readiness Dashboard</h1>
        <div class="header-meta">
          Snapshot: <strong>${snap.reportDate}</strong> &nbsp;|&nbsp;
          Environment: <span class="env-badge ${getEnvBadgeClass(snap.environment)}">${snap.environment}</span> &nbsp;|&nbsp;
          Phase: ${snap.phase}
          ${snap.notes ? `<span class="notes-tag">&#9888; ${snap.notes}</span>` : ""}
        </div>
        <div class="data-source-tag">Data source: <strong>${dataSource === 'files' ? 'data/ folder' : 'built-in'}</strong> &nbsp;|&nbsp; ${SNAPSHOTS.length} snapshot(s) loaded</div>
      </div>
      <div class="header-controls">
        <button class="reload-btn" id="reloadBtn" title="Reload latest data from data/ folder">
          <span class="reload-icon">&#8635;</span>
          <span class="reload-label">Reload</span>
        </button>
      </div>
    </div>
    ${buildSystemHeadline(snap, metrics)}
    <div class="exec-pills" style="margin-top:10px">
      ${pills.map(p => `
        <div class="pill ${p.cls}">
          <span class="pill-label">${p.label}</span>
          <strong>${p.value}</strong>
          ${p.delta}
        </div>
      `).join("")}
      ${vsPrevPill}
    </div>
  </div>`;
}

function buildControlsBar(snap) {
  // When phase filter is active, restrict the snapshot selector to matching phases only
  const visibleSnapshots = state.phaseFilter.length > 0
    ? SNAPSHOTS.map((s, i) => ({ s, i })).filter(({ s }) => state.phaseFilter.includes(s.phase))
    : SNAPSHOTS.map((s, i) => ({ s, i }));

  const snapshotOptions = visibleSnapshots.map(({ s, i }) =>
    `<option value="${i}" ${i === state.selectedSnapshot ? "selected" : ""}>${s.reportDate} (${s.environment})</option>`
  ).join("");

  const compareOptions = SNAPSHOTS.map((s, i) =>
    `<option value="${i}" ${i === state.compareSnapshot ? "selected" : ""}>${s.reportDate} (${s.environment})</option>`
  ).join("");

  const phaseChips = PHASES.map(p => `
    <button class="phase-chip ${state.phaseFilter.includes(p) ? "active" : ""}" data-phase="${p}">${p}</button>
  `).join("");

  return `
  <div class="controls-bar">
    <div class="control-group">
      <span class="control-label">Snapshot</span>
      <select class="ctrl-select" id="snapshotSelect">${snapshotOptions}</select>
    </div>

    <div class="control-divider"></div>

    <div class="control-group">
      <span class="control-label">Compare</span>
      <button class="toggle-btn ${state.compareMode ? "active" : ""}" id="compareModeBtn">
        ${state.compareMode ? "Compare ON" : "Compare OFF"}
      </button>
      <button class="quick-compare-btn" id="quickCompareBtn"
        ${state.selectedSnapshot === 0 ? 'disabled title="No previous snapshot available"' : 'title="Compare current vs previous snapshot"'}>
        &#9741; vs Previous
      </button>
      ${state.compareMode ? `
        <select class="ctrl-select" id="compareSelect">${compareOptions}</select>
      ` : ""}
    </div>

    <div class="control-divider"></div>

    <div class="control-group">
      <span class="control-label">Baseline</span>
      <div class="seg-control">
        <button class="seg-btn ${state.baseline === "total_issues" ? "active" : ""}" data-baseline="total_issues">Total Issues</button>
        <button class="seg-btn ${state.baseline === "before_mro" ? "active" : ""}" data-baseline="before_mro">Before MRO</button>
      </div>
    </div>

    <div class="control-divider"></div>

    <div class="control-group">
      <span class="control-label">View</span>
      <div class="seg-control">
        <button class="seg-btn ${state.viewMode === "snapshot" ? "active" : ""}" data-view="snapshot">Snapshot</button>
        <button class="seg-btn ${state.viewMode === "timeline" ? "active" : ""}" data-view="timeline">Timeline</button>
      </div>
    </div>

    <div class="control-divider"></div>

    <div class="control-group">
      <span class="control-label">Phase</span>
      <div class="phase-chips">${phaseChips}</div>
    </div>

    <div class="control-divider"></div>

    <div class="control-group">
      <button class="toggle-btn ${state.riskOnly ? "active" : ""}" id="riskOnlyBtn">
        ${state.riskOnly ? "&#9888; Risk Only ON" : "Risk Only"}
      </button>
    </div>

    <div class="control-divider"></div>

    <div class="control-group">
      <button class="reset-btn" id="resetBtn" title="Reset all filters and selections to default">
        &#8635; Reset
      </button>
    </div>
  </div>`;
}

function buildRiskBanner(snap, metrics) {
  const issues = [];
  if (metrics.backlogRate > 30) issues.push(`High backlog rate (${fmtPct(metrics.backlogRate)})`);
  if (metrics.highSevRate > 50) issues.push(`Critical high-severity concentration (${fmtPct(metrics.highSevRate)})`);
  if (metrics.resolutionRate < 70) issues.push(`Low resolution rate (${fmtPct(metrics.resolutionRate)})`);
  if (snap.reopen > 10) issues.push(`High reopen count (${snap.reopen} issues)`);
  return `
  <div class="risk-banner">
    <span class="risk-icon">&#9888;</span>
    <strong>RISK ALERT:</strong>&nbsp; ${issues.length > 0 ? issues.join(" &nbsp;|&nbsp; ") : "System not ready for rollout — review KPIs below"}
  </div>`;
}

function buildCompareBar(snap, cSnap) {
  if (!cSnap) return "";
  return `
  <div class="compare-bar">
    <span class="compare-label">&#9741; Compare Mode</span>
    <span>Comparing <strong>${snap.reportDate}</strong> vs <strong>${cSnap.reportDate}</strong></span>
    <span style="color:var(--subtext)">Delta indicators show change from compare snapshot → primary snapshot</span>
  </div>`;
}

function buildSnapshotView(snap, metrics, cSnap, cMetrics) {
  const phaseNotice = state.phaseFilter.length > 0 ? `
  <div class="phase-filter-notice">
    &#9432; Phase filter active: <strong>${state.phaseFilter.join(", ")}</strong>
    &mdash; Snapshot selector and Timeline chart are filtered.
  </div>` : "";

  return `
    ${buildTopRiskCallout(snap, metrics)}
    ${phaseNotice}
    ${buildKPIRow(snap, metrics, cSnap, cMetrics)}
    ${buildPanelsRow(snap, metrics)}
    ${buildTimelinePanel(snap, metrics)}
  `;
}

// ─────────────────────────────────────────────
// HELPER BUILDERS
// ─────────────────────────────────────────────
function computeStabilityLabel(metrics) {
  if (metrics.reopenRate < 10 && metrics.resolutionRate >= 80) return { label: "STABLE",     cls: "stable" };
  if (metrics.reopenRate < 20 && metrics.resolutionRate >= 60) return { label: "RECOVERING", cls: "recovering" };
  return { label: "UNSTABLE", cls: "unstable" };
}

function buildSystemHeadline(snap, metrics) {
  const idx = state.selectedSnapshot;
  const prevSnap = idx > 0 ? SNAPSHOTS[idx - 1] : null;
  const prevM    = prevSnap ? computeMetrics(prevSnap, state.baseline) : null;

  const statusColor = metrics.readiness === "READY" ? "#22c55e"
    : metrics.readiness === "CAUTION" ? "#f59e0b" : "#ef4444";

  // Identify top risk factor
  const factors = [
    { label: `high severity at ${fmtPct(metrics.highSevRate)}`, score: metrics.highSevRate },
    { label: `backlog at ${fmtPct(metrics.backlogRate)}`,        score: metrics.backlogRate },
    { label: `reopen rate at ${fmtPct(metrics.reopenRate)}`,     score: metrics.reopenRate * 1.5 },
  ].sort((a, b) => b.score - a.score);
  const topFactor = factors[0].label;

  // Direction vs previous
  let dirText = "";
  if (prevM) {
    const resUp  = metrics.resolutionRate - prevM.resolutionRate;
    const blDown = prevM.backlogRate - metrics.backlogRate;
    if (resUp > 1 && blDown > 1) dirText = `, improving since ${prevSnap.reportDate}`;
    else if (resUp < -1 || blDown < -1) dirText = `, worsening since ${prevSnap.reportDate}`;
    else dirText = `, stable since ${prevSnap.reportDate}`;
  }

  const borderColor = metrics.readiness === "READY" ? "#22c55e"
    : metrics.readiness === "CAUTION" ? "#f59e0b" : "#ef4444";

  return `
  <div class="system-headline" style="border-left-color:${borderColor}">
    System is <strong style="color:${statusColor}">${metrics.readiness}</strong>
    &mdash; ${topFactor}${dirText}.
  </div>`;
}

function buildTopRiskCallout(snap, metrics) {
  if (metrics.risk === "LOW" && metrics.readiness !== "NOT READY") return "";

  const items = [];
  if (metrics.backlogRate >= 25)            items.push(`Backlog ${fmtPct(metrics.backlogRate)}`);
  if (metrics.highSevRate >= 25)            items.push(`High Severity ${fmtPct(metrics.highSevRate)}`);
  if (metrics.reopenRate >= 15)             items.push(`Reopen Rate ${fmtPct(metrics.reopenRate)}`);
  if (snap.open + snap.reopen > 20)         items.push(`${snap.open + snap.reopen} issues still open`);
  if (snap.toConfirm > 0)                   items.push(`${snap.toConfirm} pending confirmation`);
  if (items.length === 0) return "";

  const isMedium = metrics.risk === "MEDIUM";
  const icon = isMedium ? "&#9654;" : "&#9888;";
  const label = isMedium ? "Caution" : "Risk Alert";

  return `
  <div class="top-risk-callout ${isMedium ? "medium" : ""}">
    <span style="font-weight:700">${icon} ${label}:</span>
    <strong>${items[0]}</strong>
    ${items.slice(1).map(i => `<span style="color:var(--subtext)">· ${i}</span>`).join("")}
  </div>`;
}

function buildTotalIssuesCard(snap, metrics) {
  const barPct = Math.min(100, metrics.base / 300 * 100);
  const beforePct = snap.total > 0 ? snap.beforeMRO / snap.total * 100 : 0;
  const afterPct  = snap.total > 0 ? snap.afterMRO  / snap.total * 100 : 0;
  return `
  <div class="kpi-card">
    <div class="kpi-label">Total Issues</div>
    <div class="kpi-value" style="color:#3b82f6">${fmtNum(snap.total)}</div>
    <div class="kpi-sublabel">Base: ${metrics.base} (${state.baseline === "before_mro" ? "Before MRO" : "Total"})</div>
    <div class="kpi-bar-track">
      <div class="kpi-bar-fill" style="width:${barPct}%;background:#3b82f6"></div>
    </div>
    <div class="mro-split">
      <div class="mro-split-item">
        <span class="mro-split-value">${fmtNum(snap.beforeMRO)}</span>
        <span class="mro-split-label">Before MRO</span>
      </div>
      <div class="mro-split-item">
        <span class="mro-split-value">${fmtNum(snap.afterMRO)}</span>
        <span class="mro-split-label">After MRO</span>
      </div>
    </div>
  </div>`;
}

function buildKPIRow(snap, metrics, cSnap, cMetrics) {
  const allCards = [
    { risk: false, html: buildTotalIssuesCard(snap, metrics) },
    { risk: false, html: buildKPICard("Resolved", fmtNum(metrics.resolved), `${fmtPct(metrics.resolutionRate)} resolution`, metrics.resolutionRate, "#22c55e",
        cMetrics ? getDelta(metrics.resolutionRate, cMetrics.resolutionRate, "resolution") : null, "passed", snap) },
    { risk: true,  html: buildKPICard("Pending", fmtNum(metrics.pending), `${fmtPct(metrics.backlogRate)} backlog rate`, metrics.backlogRate, metrics.backlogRate > 30 ? "#ef4444" : "#f59e0b",
        cMetrics ? getDelta(metrics.backlogRate, cMetrics.backlogRate, "backlog") : null, "backlog", snap) },
    { risk: true,  html: buildKPICard("Reopen", fmtNum(snap.reopen), `${fmtPct(metrics.reopenRate)} reopen rate`, metrics.reopenRate, metrics.reopenRate > 20 ? "#ef4444" : "#f59e0b",
        cMetrics ? getDelta(metrics.reopenRate, cMetrics.reopenRate, "reopen") : null, "reopen", snap) },
    { risk: true,  html: buildKPICard("High Severity", fmtNum(snap.severityHigh), `${fmtPct(metrics.highSevRate)} of severity issues`, metrics.highSevRate, metrics.highSevRate > 50 ? "#ef4444" : "#f59e0b",
        cMetrics ? getDelta(metrics.highSevRate, cMetrics.highSevRate, "highsev") : null, "high_severity", snap) },
    { risk: true,  html: buildReadinessCard(metrics, cMetrics) },
  ];

  const cards = state.riskOnly
    ? allCards.filter(c => c.risk).map(c => c.html)
    : allCards.map(c => c.html);

  return `<div class="kpi-row">${cards.join("")}</div>`;
}

function buildKPICard(label, value, sublabel, barPct, barColor, delta, drilldownType, snap) {
  const isClickable = !!drilldownType;
  const barWidth = Math.min(100, Math.max(0, barPct || 0));
  const isRisk = state.riskOnly && (barColor === "#ef4444");
  const isCaution = state.riskOnly && (barColor === "#f59e0b");

  return `
  <div class="kpi-card ${isClickable ? "clickable" : ""} ${isRisk ? "risk-highlight" : ""} ${isCaution ? "caution-highlight" : ""}"
       ${isClickable ? `data-drilldown="${drilldownType}"` : ""}>
    <div class="kpi-label">${label}</div>
    <div class="kpi-value" style="color:${barColor}">${value}</div>
    <div class="kpi-sublabel">${sublabel}</div>
    <div class="kpi-bar-track">
      <div class="kpi-bar-fill" style="width:${barWidth}%;background:${barColor}"></div>
    </div>
    ${delta ? `<div class="kpi-delta ${delta.cls}">${delta.label}</div>` : ""}
    ${isClickable ? `<div class="kpi-click-hint">Click for details</div>` : ""}
  </div>`;
}

function buildReadinessCard(metrics, cMetrics) {
  const rc = getReadinessClass(metrics.readiness);
  const rcColor = rc === "ready" ? "#22c55e" : rc === "caution" ? "#f59e0b" : "#ef4444";
  const isRisk = state.riskOnly && rc === "not-ready";
  const isCaution = state.riskOnly && rc === "caution";

  let delta = null;
  if (cMetrics) {
    const order = { "READY": 2, "CAUTION": 1, "NOT READY": 0 };
    const diff = order[metrics.readiness] - order[cMetrics.readiness];
    if (diff > 0) delta = { label: "↑ Improved", cls: "better" };
    else if (diff < 0) delta = { label: "↓ Declined", cls: "worse" };
    else delta = { label: "→ Same", cls: "neutral" };
  }

  return `
  <div class="kpi-card ${isRisk ? "risk-highlight" : ""} ${isCaution ? "caution-highlight" : ""}">
    <div class="kpi-label">Rollout Readiness</div>
    <div style="margin:6px 0"><span class="readiness-badge ${rc}">${metrics.readiness}</span></div>
    <div class="kpi-sublabel">Res: ${fmtPct(metrics.resolutionRate)} | BL: ${fmtPct(metrics.backlogRate)}</div>
    <div class="kpi-bar-track">
      <div class="kpi-bar-fill" style="width:${metrics.resolutionRate}%;background:${rcColor}"></div>
    </div>
    ${delta ? `<div class="kpi-delta ${delta.cls}">${delta.label}</div>` : ""}
  </div>`;
}

function buildPanelsRow(snap, metrics) {
  if (state.riskOnly) {
    return `
    <div class="panels-row" style="grid-template-columns:1fr">
      ${buildRiskPanel(snap, metrics)}
    </div>`;
  }
  return `
  <div class="panels-row">
    ${buildQualityPanel(snap, metrics)}
    ${buildRiskPanel(snap, metrics)}
  </div>`;
}

function buildQualityPanel(snap, metrics) {
  const stats = [
    { label: "Resolution Rate", value: fmtPct(metrics.resolutionRate), pct: metrics.resolutionRate, color: metrics.resolutionRate >= 80 ? "#22c55e" : metrics.resolutionRate >= 60 ? "#f59e0b" : "#ef4444" },
    { label: "Backlog Rate", value: fmtPct(metrics.backlogRate), pct: metrics.backlogRate, color: metrics.backlogRate <= 20 ? "#22c55e" : metrics.backlogRate <= 40 ? "#f59e0b" : "#ef4444" },
    { label: "Reopen Rate", value: fmtPct(metrics.reopenRate), pct: metrics.reopenRate, color: metrics.reopenRate <= 10 ? "#22c55e" : metrics.reopenRate <= 20 ? "#f59e0b" : "#ef4444" },
  ];

  const prbMax = Math.max(...snap.passedReopenBreakdown, 1);

  const stability = computeStabilityLabel(metrics);
  const stabilityIcon = stability.cls === "stable" ? "&#10003;" : stability.cls === "recovering" ? "&#9654;" : "&#9888;";

  return `
  <div class="panel">
    <div class="panel-title">Quality &amp; Stability</div>
    <div class="stability-badge ${stability.cls}">${stabilityIcon} ${stability.label}</div>
    <div class="chart-container small">
      <canvas id="doughnutChart"></canvas>
    </div>
    <div class="doughnut-legend" id="doughnutLegend"></div>
    <div class="stats-list mt-3">
      ${stats.map(s => `
        <div class="stat-row">
          <span class="stat-label">${s.label}</span>
          <div class="stat-bar-container">
            <div class="stat-bar" style="width:${Math.min(100,s.pct)}%;background:${s.color}"></div>
          </div>
          <span class="stat-value" style="color:${s.color}">${s.value}</span>
        </div>
      `).join("")}
    </div>
    <div class="reopen-breakdown">
      <div class="reopen-breakdown-title">Passed Issues Previously Reopened</div>
      <div class="breakdown-bars">
        ${snap.passedReopenBreakdown.map((v, i) => `
          <div class="breakdown-bar-row">
            <span class="breakdown-bar-label">R${i+1}</span>
            <div class="breakdown-bar-track">
              <div class="breakdown-bar-fill" style="width:${prbMax > 0 ? (v/prbMax*100) : 0}%;background:${i===0?"#3b82f6":i===1?"#f59e0b":"#ef4444"}"></div>
            </div>
            <span class="breakdown-bar-val">${v}</span>
          </div>
        `).join("")}
      </div>
    </div>
  </div>`;
}

function buildRiskPanel(snap, metrics) {
  const sevMax = Math.max(snap.severityHigh, snap.severityMedium, snap.severityLow, 1);
  const rbMax = Math.max(...snap.reopenBreakdown, 1);

  const riskClass = metrics.risk.toLowerCase();

  return `
  <div class="panel">
    <div class="panel-title">Risk Analysis</div>
    <div class="risk-badge ${riskClass}">
      ${metrics.risk === "HIGH" ? "&#9888;" : metrics.risk === "MEDIUM" ? "&#9654;" : "&#10003;"}
      ${metrics.risk} RISK
    </div>
    <div class="chart-container small">
      <canvas id="severityChart"></canvas>
    </div>
    <div class="risk-metrics">
      <div class="risk-metric">
        <span class="risk-metric-label">High Severity Concentration</span>
        <span class="risk-metric-value" style="color:${metrics.highSevRate > 50 ? "#ef4444" : metrics.highSevRate > 25 ? "#f59e0b" : "#22c55e"}">${fmtPct(metrics.highSevRate)}</span>
      </div>
      <div class="risk-metric">
        <span class="risk-metric-label">Open + Reopen</span>
        <span class="risk-metric-value" style="color:${(snap.open+snap.reopen) > 20 ? "#ef4444" : "#f59e0b"}">${snap.open + snap.reopen}</span>
      </div>
      ${snap.toConfirm > 0 ? `
      <div class="risk-metric">
        <span class="risk-metric-label">To Confirm</span>
        <span class="risk-metric-value" style="color:#f59e0b">${snap.toConfirm}</span>
      </div>` : ""}
    </div>
    <div class="reopen-breakdown mt-3">
      <div class="reopen-breakdown-title">Current Reopen by Times</div>
      <div class="breakdown-bars">
        ${snap.reopenBreakdown.map((v, i) => `
          <div class="breakdown-bar-row">
            <span class="breakdown-bar-label">R${i+1}</span>
            <div class="breakdown-bar-track">
              <div class="breakdown-bar-fill" style="width:${rbMax > 0 ? (v/rbMax*100) : 0}%;background:${["#3b82f6","#f59e0b","#ef4444","#dc2626"][i]}"></div>
            </div>
            <span class="breakdown-bar-val">${v}</span>
          </div>
        `).join("")}
      </div>
    </div>
  </div>`;
}

function buildTimelinePanel(snap, metrics) {
  // compute trend arrows for current snapshot vs previous
  const idx = state.selectedSnapshot;
  const prev = idx > 0 ? SNAPSHOTS[idx - 1] : null;
  const prevM = prev ? computeMetrics(prev, state.baseline) : null;

  function trendArrow(curr, prev, higherIsBetter) {
    if (!prev) return "";
    const diff = curr - prev;
    if (Math.abs(diff) < 0.1) return '<span class="trend-neutral">→</span>';
    const up = diff > 0;
    const good = higherIsBetter ? up : !up;
    const arrow = up ? "↑" : "↓";
    return `<span class="${good ? "trend-up-good" : "trend-up-bad"}">${arrow}</span>`;
  }

  const rows = [
    { label: "Resolution Rate", curr: fmtPct(metrics.resolutionRate), arrow: trendArrow(metrics.resolutionRate, prevM?.resolutionRate, true) },
    { label: "Backlog Rate", curr: fmtPct(metrics.backlogRate), arrow: trendArrow(metrics.backlogRate, prevM?.backlogRate, false) },
    { label: "Reopen Rate", curr: fmtPct(metrics.reopenRate), arrow: trendArrow(metrics.reopenRate, prevM?.reopenRate, false) },
    { label: "High Severity %", curr: fmtPct(metrics.highSevRate), arrow: trendArrow(metrics.highSevRate, prevM?.highSevRate, false) },
  ];

  return `
  <div class="timeline-panel">
    <div class="timeline-toggle-header" id="timelineToggle">
      <div class="panel-title" style="margin-bottom:0">Trend Over Time</div>
      <span class="timeline-expand-icon ${state.timelineExpanded ? "open" : ""}" id="timelineExpandIcon">&#9660;</span>
    </div>
    <div class="timeline-content ${state.timelineExpanded ? "expanded" : "collapsed"}" id="timelineContent">
      <div style="padding-top:14px">
        <div class="chart-container medium">
          <canvas id="trendChart"></canvas>
        </div>
        <div class="flex items-center gap-2 flex-wrap mt-2" style="margin-top:10px">
          ${rows.map(r => `
            <div class="pill blue" style="gap:4px">
              <span class="pill-label">${r.label}</span>
              <strong>${r.curr}</strong>
              ${r.arrow}
            </div>
          `).join("")}
        </div>
      </div>
    </div>
  </div>`;
}

function buildTimelineView() {
  const filtered = getFilteredSnapshots();
  const miniCards = filtered.map((s, i) => {
    const m = computeMetrics(s, state.baseline);
    const rc = getReadinessClass(m.readiness);
    const rcColor = rc === "ready" ? "#22c55e" : rc === "caution" ? "#f59e0b" : "#ef4444";
    const isSelected = SNAPSHOTS.indexOf(s) === state.selectedSnapshot;
    return `
    <div class="snapshot-mini-card ${isSelected ? "selected" : ""}" data-snap-idx="${SNAPSHOTS.indexOf(s)}">
      <div class="mini-card-date">${s.reportDate}</div>
      <div class="mini-card-env"><span class="env-badge ${getEnvBadgeClass(s.environment)}">${s.environment}</span> &nbsp; ${s.phase}</div>
      <div class="mini-card-metrics">
        <div class="mini-card-metric">
          <span class="mini-card-metric-label">Resolution</span>
          <span class="mini-card-metric-value" style="color:${getPillClass("resolution",m.resolutionRate)==="green"?"#22c55e":getPillClass("resolution",m.resolutionRate)==="yellow"?"#f59e0b":"#ef4444"}">${fmtPct(m.resolutionRate)}</span>
        </div>
        <div class="mini-card-metric">
          <span class="mini-card-metric-label">Backlog</span>
          <span class="mini-card-metric-value">${fmtPct(m.backlogRate)}</span>
        </div>
        <div class="mini-card-metric">
          <span class="mini-card-metric-label">Readiness</span>
          <span class="mini-card-metric-value" style="color:${rcColor}">${m.readiness}</span>
        </div>
      </div>
    </div>`;
  }).join("");

  return `
  <div class="timeline-full">
    <div class="panel-title">Timeline — All Metrics</div>
    <div class="timeline-full-chart">

// ─────────────────────────────────────────────
// BIND EVENTS
// ─────────────────────────────────────────────
function bindEvents() {
  // Reload button
  const reloadBtn = document.getElementById("reloadBtn");
  if (reloadBtn) reloadBtn.addEventListener("click", reloadData);

  // Quick compare: current vs previous
  const quickCompareBtn = document.getElementById("quickCompareBtn");
  if (quickCompareBtn) quickCompareBtn.addEventListener("click", () => {
    if (state.selectedSnapshot > 0) {
      state.compareMode = true;
      state.compareSnapshot = state.selectedSnapshot - 1;
      render();
    }
  });

  // Reset dashboard
  const resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.addEventListener("click", () => {
    state.selectedSnapshot = SNAPSHOTS.length - 1;
    state.compareMode = false;
    state.compareSnapshot = Math.max(0, SNAPSHOTS.length - 2);
    state.baseline = "before_mro";
    state.viewMode = "snapshot";
    state.drilldown = null;
    state.phaseFilter = [];
    state.riskOnly = false;
    state.timelineExpanded = true;
    render();
  });

  // Snapshot select
  const snapSel = document.getElementById("snapshotSelect");
  if (snapSel) snapSel.addEventListener("change", e => { state.selectedSnapshot = +e.target.value; render(); });

  // Compare mode
  const compareBtn = document.getElementById("compareModeBtn");
  if (compareBtn) compareBtn.addEventListener("click", () => { state.compareMode = !state.compareMode; render(); });

  // Compare select
  const compareSel = document.getElementById("compareSelect");
  if (compareSel) compareSel.addEventListener("change", e => { state.compareSnapshot = +e.target.value; render(); });

  // Baseline
  document.querySelectorAll("[data-baseline]").forEach(btn => {
    btn.addEventListener("click", () => { state.baseline = btn.dataset.baseline; render(); });
  });

  // View mode
  document.querySelectorAll("[data-view]").forEach(btn => {
    btn.addEventListener("click", () => { state.viewMode = btn.dataset.view; render(); });
  });

  // Phase chips — also auto-advance snapshot selection when filtered out
  document.querySelectorAll("[data-phase]").forEach(chip => {
    chip.addEventListener("click", () => {
      const phase = chip.dataset.phase;
      const idx = state.phaseFilter.indexOf(phase);
      if (idx === -1) state.phaseFilter.push(phase);
      else state.phaseFilter.splice(idx, 1);

      // If current snapshot is no longer in the active filter, pick the latest valid one
      if (state.phaseFilter.length > 0) {
        const currentSnap = SNAPSHOTS[state.selectedSnapshot];
        if (!state.phaseFilter.includes(currentSnap.phase)) {
          const validIndices = SNAPSHOTS
            .map((s, i) => ({ s, i }))
            .filter(({ s }) => state.phaseFilter.includes(s.phase))
            .map(({ i }) => i);
          if (validIndices.length > 0) {
            state.selectedSnapshot = validIndices[validIndices.length - 1];
          }
        }
      }
      render();
    });
  });

  // Risk only
  const riskBtn = document.getElementById("riskOnlyBtn");
  if (riskBtn) riskBtn.addEventListener("click", () => { state.riskOnly = !state.riskOnly; render(); });

  // Timeline toggle
  const timelineToggle = document.getElementById("timelineToggle");
  if (timelineToggle) {
    timelineToggle.addEventListener("click", () => {
      state.timelineExpanded = !state.timelineExpanded;
      const icon = document.getElementById("timelineExpandIcon");
      const content = document.getElementById("timelineContent");
      if (icon) icon.classList.toggle("open", state.timelineExpanded);
      if (content) {
        content.classList.toggle("expanded", state.timelineExpanded);
        content.classList.toggle("collapsed", !state.timelineExpanded);
      }
    });
  }

  // KPI card drilldowns
  document.querySelectorAll("[data-drilldown]").forEach(card => {
    card.addEventListener("click", () => {
      const type = card.dataset.drilldown;
      openDrilldown(type);
    });
  });

  // Snapshot mini cards (timeline view)
  document.querySelectorAll("[data-snap-idx]").forEach(card => {
    card.addEventListener("click", () => {
      state.selectedSnapshot = +card.dataset.snapIdx;
      render();
    });
  });

  // Modal close
  const overlay = document.getElementById("modalOverlay");
  if (overlay) {
    overlay.addEventListener("click", e => {
      if (e.target === overlay) closeDrilldown();
    });
  }

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeDrilldown();
  }, { once: true });
}

// ─────────────────────────────────────────────
// DRILLDOWN MODAL
// ─────────────────────────────────────────────
function openDrilldown(type) {
  state.drilldown = type;
  const overlay = document.getElementById("modalOverlay");
  const content = document.getElementById("modalContent");

  const snap = SNAPSHOTS[state.selectedSnapshot];
  const metrics = computeMetrics(snap, state.baseline);
  const prevSnap = state.selectedSnapshot > 0 ? SNAPSHOTS[state.selectedSnapshot - 1] : null;
  const prevMetrics = prevSnap ? computeMetrics(prevSnap, state.baseline) : null;

  content.innerHTML = buildDrilldownContent(type, snap, metrics, prevSnap, prevMetrics);
  overlay.classList.add("open");

  // Bind close button
  const closeBtn = document.getElementById("modalCloseBtn");
  if (closeBtn) closeBtn.addEventListener("click", closeDrilldown);

  // Render modal chart
  requestAnimationFrame(() => renderModalChart(type, snap, metrics));
}

function closeDrilldown() {
  state.drilldown = null;
  const overlay = document.getElementById("modalOverlay");
  overlay.classList.remove("open");
  destroyChart("modalChart");
}

function buildDrilldownContent(type, snap, metrics, prevSnap, prevMetrics) {
  const titles = {
    reopen: "Reopen Analysis",
    backlog: "Backlog Analysis",
    high_severity: "High Severity Analysis",
    passed: "Resolved / Passed Analysis"
  };

  const content = {
    reopen: buildReopenDrilldown(snap, metrics, prevSnap, prevMetrics),
    backlog: buildBacklogDrilldown(snap, metrics, prevSnap, prevMetrics),
    high_severity: buildHighSevDrilldown(snap, metrics, prevSnap, prevMetrics),
    passed: buildPassedDrilldown(snap, metrics, prevSnap, prevMetrics),
  };

  return `
  <div class="modal-header">
    <div class="modal-title">${titles[type] || type}</div>
    <div class="modal-close" id="modalCloseBtn">&#10005;</div>
  </div>
  <div style="font-size:12px;color:var(--subtext);margin-bottom:14px">
    ${snap.reportDate} &nbsp;|&nbsp; <span class="env-badge ${getEnvBadgeClass(snap.environment)}">${snap.environment}</span> &nbsp;|&nbsp; ${snap.phase}
  </div>
  ${content[type] || ""}`;
}

  <div class="modal-section">
    <div class="modal-stat-grid">

      </div>

        <div class="modal-stat-box-value">${fmtPct(metrics.reopenRate)}</div>
        <div class="modal-stat-box-label">Reopen Rate</div>
      </div>

      <thead><tr><th>Reopen</th><th>Count</th><th>% of Total Reopen</th></tr></thead>
      <tbody>
        ${snap.reopenBreakdown.map((v, i) => `
          <tr>
            <td>Reopened ${i+1}x (R${i+1})</td>
            <td><strong>${v}</strong></td>
            <td>${snap.reopen > 0 ? fmtPct(v/snap.reopen*100) : "0%"}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
  </div>
  <div class="modal-section">
    <div class="modal-section-title">Trend vs Previous Snapshot</div>
    <div class="modal-trend">
      <span class="modal-trend-label">Reopen count trend:</span>
      <span class="modal-trend-value">${prevTrend}</span>
      <span>${diffLabel}</span>
    </div>
    ${prevSnap ? `
    <div class="modal-trend mt-2">
      <span class="modal-trend-label">Reopen rate trend:</span>
      <span class="modal-trend-value">${fmtPct(prevMetrics.reopenRate)} → ${fmtPct(metrics.reopenRate)}</span>

// CHART RENDERING
// ─────────────────────────────────────────────
const CHART_COLORS = {
  passed: "#22c55e",
  closed: "#3b82f6",
  cancelled: "#94a3b8",
  open: "#f59e0b",
  reopen: "#ef4444",
  toConfirm: "#8b5cf6",
  high: "#ef4444",
  medium: "#f59e0b",
  low: "#22c55e",
};

Chart.defaults.color = "#94a3b8";
Chart.defaults.borderColor = "#334155";
Chart.defaults.font.family = "'Segoe UI', system-ui, sans-serif";

function renderCharts(snap, metrics, cSnap, cMetrics) {
  if (state.viewMode === "snapshot") {
    renderDoughnutChart(snap);
    renderSeverityChart(snap, metrics);
    if (state.timelineExpanded) renderTrendChart();
  } else {
    renderTimelineFullChart();
  }
}

function renderDoughnutChart(snap) {
  const el = document.getElementById("doughnutChart");
  if (!el) return;
  destroyChart("doughnutChart");

  const data = [
    { label: "Passed", value: snap.passed, color: CHART_COLORS.passed },
    { label: "Closed", value: snap.closed, color: CHART_COLORS.closed },
    { label: "Cancelled", value: snap.cancelled, color: CHART_COLORS.cancelled },
    { label: "Open", value: snap.open, color: CHART_COLORS.open },
    { label: "Reopen", value: snap.reopen, color: CHART_COLORS.reopen },
    { label: "To Confirm", value: snap.toConfirm, color: CHART_COLORS.toConfirm },
  ].filter(d => d.value > 0);

  const legend = document.getElementById("doughnutLegend");
  if (legend) {
    legend.innerHTML = data.map(d => `
      <div class="doughnut-legend-item">
        <div class="doughnut-legend-dot" style="background:${d.color}"></div>
        <span>${d.label}</span>
        <span class="doughnut-legend-val">${d.value}</span>
      </div>
    `).join("");
  }

  const chart = new Chart(el, {
    type: "doughnut",
    data: {
      labels: data.map(d => d.label),
      datasets: [{
        data: data.map(d => d.value),
        backgroundColor: data.map(d => d.color),
        borderColor: "#1e293b",
        borderWidth: 2,
        hoverBorderWidth: 3,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => ` ${ctx.label}: ${ctx.raw} (${(ctx.raw/snap.total*100).toFixed(1)}%)`
          }
        }
      },
      cutout: "65%",
    }
  });
  registerChart("doughnutChart", chart);
}

        legend: { display: true, position: "top", labels: { usePointStyle: true, pointStyle: "circle", padding: 14, font: { size: 11 } } },

      scales: {
        x: { grid: { color: "#334155" }, ticks: { color: "#94a3b8", font: { size: 11 } }, border: { display: false } },
        y: {
          grid: { color: "#334155" },
          ticks: { color: "#94a3b8", font: { size: 11 }, callback: v => v === 100 ? "READY/100%" : v === 50 ? "CAUTION" : v + "%" },
          border: { display: false }, min: 0, max: 110,

        y1: {
          position: "right",
          grid: { display: false },
          ticks: { color: "#64748b", font: { size: 10 } },
          border: { display: false }, min: 0,

  registerChart("trendChart", chart);
}

function renderTimelineFullChart() {
  const el = document.getElementById("timelineFullChart");
  if (!el) return;
  destroyChart("timelineFullChart");

  const filtered = getFilteredSnapshots();
  if (filtered.length === 0) return;

  const labels = filtered.map(s => s.reportDate);
  const colors = ["#22c55e", "#ef4444", "#f59e0b", "#8b5cf6", "#06b6d4", "#64748b"];
  const readinessScore = s => ({ "READY": 100, "CAUTION": 50, "NOT READY": 0 }[computeMetrics(s, state.baseline).readiness] ?? 0);
  const metricDefs = [
    { label: "Resolution Rate %", fn: m => +m.resolutionRate.toFixed(1), yAxisID: "y",  tension: 0.3 },
    { label: "Backlog Rate %",    fn: m => +m.backlogRate.toFixed(1),    yAxisID: "y",  tension: 0.3 },
    { label: "Reopen Rate %",     fn: m => +m.reopenRate.toFixed(1),     yAxisID: "y",  tension: 0.3 },
    { label: "High Severity %",   fn: m => +m.highSevRate.toFixed(1),    yAxisID: "y",  tension: 0.3 },
    { label: "Readiness",         fn: (m, s) => readinessScore(s),       yAxisID: "y",  tension: 0,   stepped: true, borderDash: [6,3] },
    { label: "Total Issues",      fn: (m, s) => s.total,                 yAxisID: "y1", tension: 0.2, borderDash: [3,3] },
  ];

  const legend = document.getElementById("timelineLegend");
  if (legend) {
    legend.innerHTML = metricDefs.map((d, i) => `
      <div class="legend-item">
        <div class="legend-dot" style="background:${colors[i]}"></div>
        <span>${d.label}</span>
      </div>
    `).join("");
  }

  const datasets = metricDefs.map((def, i) => ({
    label: def.label,
    data: filtered.map(s => def.fn(computeMetrics(s, state.baseline), s)),
    borderColor: colors[i],
    backgroundColor: colors[i] + "20",
    pointRadius: 6, pointHoverRadius: 9,
    fill: false,
    tension: def.tension ?? 0.3,
    borderWidth: 2.5,
    stepped: def.stepped || false,
    borderDash: def.borderDash || [],
    yAxisID: def.yAxisID,
  }));

  const chart = new Chart(el, {
    type: "line",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: true, position: "top", labels: { usePointStyle: true, pointStyle: "circle", padding: 16, font: { size: 12 } } },
        tooltip: { callbacks: { label: ctx => ctx.dataset.yAxisID === "y1"
          ? ` ${ctx.dataset.label}: ${ctx.raw}`
          : ctx.dataset.label === "Readiness"
            ? ` Readiness: ${ctx.raw === 100 ? "READY" : ctx.raw === 50 ? "CAUTION" : "NOT READY"}`
            : ` ${ctx.dataset.label}: ${ctx.raw}%` } }
      },
      scales: {
        x: { grid: { color: "#334155" }, ticks: { color: "#94a3b8", font: { size: 12 } }, border: { display: false } },
        y: {
          grid: { color: "#334155" },
          ticks: { color: "#94a3b8", font: { size: 11 }, callback: v => v === 100 ? "READY" : v === 50 ? "CAUTION" : v + "%" },
          border: { display: false }, min: 0, max: 110,
        },
        y1: {
          position: "right",
          grid: { display: false },
          ticks: { color: "#64748b", font: { size: 11 } },
          border: { display: false }, min: 0,
        }
      }
    }
  });
  registerChart("timelineFullChart", chart);
}

function renderModalChart(type, snap, metrics) {
  const el = document.getElementById("modalChart");
  if (!el) return;
  destroyChart("modalChart");

  let chart;

  if (type === "reopen") {
    const labels = snap.reopenBreakdown.map((_, i) => `R${i+1}`);
    chart = new Chart(el, {
      type: "bar",
      data: {
        labels,
        datasets: [{
          label: "Issues reopened",
          data: snap.reopenBreakdown,
          backgroundColor: ["#3b82f6", "#f59e0b", "#ef4444", "#dc2626"],
          borderRadius: 5,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#94a3b8" }, border: { display: false } },
          y: { grid: { color: "#334155" }, ticks: { color: "#94a3b8", stepSize: 1 }, border: { display: false }, min: 0 }
        }
      }
    });
  } else if (type === "backlog") {
    chart = new Chart(el, {
      type: "doughnut",
      data: {
        labels: ["Open", "Reopen", "To Confirm"],
        datasets: [{
          data: [snap.open, snap.reopen, snap.toConfirm],
          backgroundColor: ["#3b82f6", "#f59e0b", "#8b5cf6"],
          borderColor: "#1e293b",
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: "right", labels: { usePointStyle: true, pointStyle: "circle", font: { size: 11 }, padding: 10 } }
        },
        cutout: "60%",
      }
    });
  } else if (type === "high_severity") {
    chart = new Chart(el, {
      type: "doughnut",
      data: {
        labels: ["High", "Medium", "Low"],
        datasets: [{
          data: [snap.severityHigh, snap.severityMedium, snap.severityLow],
          backgroundColor: [CHART_COLORS.high, CHART_COLORS.medium, CHART_COLORS.low],
          borderColor: "#1e293b",
          borderWidth: 2,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: {
          legend: { display: true, position: "right", labels: { usePointStyle: true, pointStyle: "circle", font: { size: 11 }, padding: 10 } },
          tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw} (${metrics.sevTotal > 0 ? (ctx.raw/metrics.sevTotal*100).toFixed(1) : 0}%)` } }
        },
        cutout: "60%",
      }
    });
  } else if (type === "passed") {
    chart = new Chart(el, {
      type: "bar",
      data: {
        labels: ["Passed", "Closed", "Cancelled"],
        datasets: [{
          label: "Count",
          data: [snap.passed, snap.closed, snap.cancelled],
          backgroundColor: [CHART_COLORS.passed, CHART_COLORS.closed, CHART_COLORS.cancelled],
          borderRadius: 5,
          borderSkipped: false,
        }]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false }, ticks: { color: "#94a3b8" }, border: { display: false } },
          y: { grid: { color: "#334155" }, ticks: { color: "#94a3b8" }, border: { display: false }, min: 0 }
        }
      }
    });
  }

  if (chart) registerChart("modalChart", chart);
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
init();
</script>
</body>
</html>
